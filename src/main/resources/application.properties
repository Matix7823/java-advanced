# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── MongoDB ──────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://localhost:27017/letsplay

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Generate a strong secret in production: openssl rand -base64 64
app.jwt.secret=your-very-long-and-secure-base64-secret-change-in-production-please
app.jwt.expiration-ms=86400000

# ─── Rate limiting ────────────────────────────────────────────────────────────
app.rate-limit.capacity=60
app.rate-limit.refill-tokens=60
app.rate-limit.refill-seconds=60

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.letsplay=DEBUG
